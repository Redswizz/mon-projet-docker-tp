services:
  backend:
    build:
      target: production
    # Plus de port exposé : le backend n'est joignable que via Nginx
    ports: !reset []

  frontend:
    build:
      target: production
    # Seul point d'entrée : le port 80 de ta machine vers le 8080 de Nginx
    ports: !override
      - "${HTTP_PORT:-80}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/"]