server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Les appels /api sont relayés vers le backend (équivalent du proxy Vite en dev)
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}